.drawer h2:focus,.surface-card h2:focus,.confirm-card h2:focus{outline:none}.surface-folder-content .field-label,.surface-folder-content .help{margin:0}.surface-header .section-title{font-size:18px}


.divider{margin:18px 0}.drawer-body>div>section>.form-row:first-child{padding-top:0}.help.error{color:var(--danger)}

.folder-settings .form-row{padding:12px 0}.folder-settings .divider{margin:14px 0}


/* 03: original Eous artwork, warm paper and one shared corner radius. */
:root{--radius:12px;--bg:#F6F2EA;--surface:#FFFDF8;--text:#344C43;--muted:#647166;--border:#D7DCD0;--line:#EBEAE2;--accent:#AE4C25;--accent-dark:#913C1D;--selected:#E7ECDD;--success:#55775B;--danger:#A8392F;--shadow:0 18px 64px #344C431C}
html,body{background:#E5E7DE}
.app-window{border-radius:var(--radius)}
.titlebar{background:var(--surface);padding-left:16px}
.app-title{gap:8px;font-weight:600}
.brand-icon{width:25px;height:25px;object-fit:cover;border-radius:var(--radius)}
.window-actions{gap:2px;padding:4px;height:39px}
.window-actions button{height:31px;width:38px}
.sidebar{width:184px;padding:22px 14px 14px;position:relative;overflow:hidden}
.nav{padding-inline:12px;height:41px;flex-shrink:0}
.nav.selected{color:#405B3F;background:var(--selected)}
.nav.selected:before{display:none}
.nav-caption{padding-top:22px}
.nav-bottom{margin-top:0;position:relative;flex-shrink:0}
.sidebar-scene{flex:1;min-height:72px;position:relative;margin:10px -14px 4px;overflow:hidden;pointer-events:none}
.sidebar-scene:after{content:'';position:absolute;left:26px;right:22px;bottom:8px;height:1px;background:var(--border)}
.eous-character{position:absolute;width:171px;height:211px;object-fit:contain;bottom:8px;left:6px;z-index:1}
.main{padding:24px 25px 18px}
.page-head{min-height:67px}
.page-head h1{font-size:24px;letter-spacing:.01em}
.group{margin-bottom:23px}
.group-head{min-height:33px}
.tool-row{min-height:73px;grid-template-columns:28px minmax(0,1fr) 74px 105px;gap:12px}
.tool-name{font-size:16px}
.tool-alias{margin-left:8px;font-size:13px}
.tool-desc{font-size:13px}
.tool-glyph.native{color:#55775B}
.tool-glyph{color:var(--muted);width:26px;height:26px}
.row-actions{gap:12px}
.row-actions>.text-btn{min-width:42px;font-size:13px;white-space:nowrap}
.row-actions>.text-btn:not(:disabled){color:var(--accent-dark)}
.tool-switch{width:46px;height:26px;min-width:46px;border:1px solid #B0B9AB;background:#D5DBCF;position:relative;padding:0;display:inline-flex;align-items:center;transition:background 180ms,border-color 180ms}
.switch-thumb{width:20px;height:20px;position:absolute;left:2px;top:2px;background:#FFFDF8;border-radius:var(--radius);box-shadow:0 1px 3px #344C4333;transition:transform 180ms var(--ease)}
.tool-switch.on{background:#55775B;border-color:#55775B}
.tool-switch.on .switch-thumb{transform:translateX(20px)}
.tool-switch:disabled{opacity:.55}
.tool-switch[aria-busy=true]{opacity:.8}
.tool-switch:active:not(:disabled){transform:none}
.footer{padding-left:209px;background:var(--surface)}
.drawer{border-radius:var(--radius);border:1px solid var(--border)}
.drawer-head{background:var(--surface)}
.surface-card,.notice,.confirm-card,.reopen-stage{border-radius:var(--radius)}
input[type=checkbox]{appearance:none;border:1px solid #A2AD9C;border-radius:var(--radius);background:var(--surface);width:20px;height:20px;position:relative;cursor:pointer}
input[type=checkbox]:checked{background:var(--success);border-color:var(--success)}
input[type=checkbox]:checked:after{content:'';position:absolute;left:6px;top:3px;width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
[data-theme=dark]{--bg:#29342E;--surface:#222B26;--text:#F2F0E7;--muted:#BAC4B7;--border:#4E5B4E;--line:#39463C;--accent:#EBAD86;--accent-dark:#F2B995;--selected:#3D503C;--success:#A4C198;--danger:#F0A093}
[data-theme=dark] .nav.selected{color:#E6EBDD}
[data-theme=dark] .tool-glyph.native{color:var(--success)}
[data-theme=dark] .tool-switch.on{background:#789A6E;border-color:#789A6E}
@media(max-width:850px){.sidebar{width:150px;padding-inline:8px}.sidebar-scene{margin-inline:-8px}.eous-character{width:145px;height:180px;left:2px}.main{padding-inline:18px}.tool-row{grid-template-columns:25px minmax(0,1fr) 70px 99px;gap:8px}.tool-alias{display:none}.footer{padding-left:168px}.row-actions{gap:8px}}
@media(max-width:640px){.sidebar{width:52px;padding-inline:6px}.nav{padding:0}.sidebar-scene{display:none}.nav-bottom{margin-top:auto}.tool-row{grid-template-columns:24px minmax(0,1fr) 64px;min-height:96px}.row-actions{gap:3px}.tool-state{grid-column:2}.footer{padding:8px 16px}.main{padding:18px 16px}.page-head{min-height:94px}.tool-desc{line-height:1.6}}

@media(max-height:650px){.sidebar-scene{display:none}.nav-bottom{margin-top:auto}.sidebar{padding-block:12px}.nav{height:36px}.nav-caption{padding-top:12px}}

.app-window,.reopen-stage{color:var(--text)}
.row-actions>.text-btn:not(:disabled){color:var(--muted)}
.row-actions>.text-btn.repair:not(:disabled){color:var(--accent-dark);font-weight:600}
.surface-app-glyph{width:23px;height:23px;color:var(--muted)}

.surface-header{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 20px;border-bottom:1px solid var(--border)}
.surface-header .section-title{margin:0;font-size:16px;line-height:24px}
.surface-close,.surface-icon-btn{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;width:32px;height:32px;padding:0;background:transparent;border:1px solid transparent;border-radius:var(--radius);color:var(--muted);cursor:pointer}
.surface-close:hover,.surface-icon-btn:hover{color:var(--text);background:var(--bg);border-color:var(--border)}
.surface-close:focus-visible,.surface-icon-btn:focus-visible,.surface-app-row:focus-visible,.surface-folder-select:focus-visible,.surface-tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.surface-files{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 16px}
.surface-file{padding:6px 9px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);color:var(--text);font-size:13px;line-height:20px;overflow-wrap:anywhere}
.surface-app-row{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;padding:10px 8px;background:transparent;border:0;border-bottom:1px solid var(--line);color:var(--text);font:inherit;font-size:14px;text-align:left;cursor:pointer}
.surface-app-row:hover{background:var(--selected)}
.surface-app-mark{display:flex;align-items:center;justify-content:center;flex:0 0 30px;height:30px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius);font-size:14px;font-weight:600;color:var(--muted)}
.surface-arrow{margin-left:auto;color:var(--muted);flex-shrink:0}
.surface-footer{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-top:16px;padding-top:14px;border-top:1px solid var(--border)}
.surface-footer .help{margin:0;font-size:13px;line-height:20px}
.surface-footer .btn,.surface-footer .text-btn{flex-shrink:0}
.surface-meta{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:4px}
.surface-meta .section-help{margin:0;font-size:14px}
.surface-meta .tag{flex-shrink:0;font-size:13px}
.surface-link-list{min-width:0}
.surface-link-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}
.surface-link-row:last-child{border-bottom:0}
.surface-link-content{min-width:0;flex:1}
.surface-link-content h3{margin:0 0 5px;font-size:14px;line-height:22px}
.surface-link-content .help,.surface-link-content .error{margin:6px 0 0;font-size:13px;line-height:20px}
.surface-link-row>.btn{flex-shrink:0}
.surface-url{margin:0;color:var(--muted);font-size:13px;line-height:20px;overflow-wrap:anywhere}
.surface-tabs{display:flex;gap:20px;margin-bottom:8px;border-bottom:1px solid var(--border)}
.surface-tabs button{position:relative;margin:0 0 -1px;padding:10px 0;background:transparent;border:0;border-bottom:2px solid transparent;color:var(--muted);font:inherit;font-size:14px;line-height:22px;cursor:pointer;white-space:nowrap}
.surface-tabs button:hover{color:var(--text)}
.surface-tabs button.active{border-bottom-color:var(--accent);color:var(--accent);font-weight:600}
.surface-folder-list{max-height:240px;overflow-y:auto;overscroll-behavior:contain;scrollbar-gutter:stable}
.surface-folder-row{display:flex;align-items:center;gap:8px;min-width:0;padding:4px 6px;border-bottom:1px solid var(--line);border-left:2px solid transparent}
.surface-folder-row:hover{background:var(--bg)}
.surface-folder-row.selected{background:var(--selected);border-left-color:var(--accent)}
.surface-folder-select{display:flex;align-items:flex-start;gap:10px;min-width:0;flex:1;min-height:76px;padding:10px 0;background:transparent;border:0;color:var(--text);font:inherit;text-align:left;cursor:pointer}
.surface-folder-select>svg{flex-shrink:0;margin-top:2px;color:var(--muted)}
.surface-folder-content{display:grid;gap:3px;min-width:0;flex:1;font-size:14px;line-height:22px}
.surface-folder-content .field-label{font-size:14px;line-height:22px;overflow-wrap:anywhere}
.surface-folder-path{display:block;overflow-wrap:anywhere;word-break:break-word;font-size:13px;line-height:20px}
.surface-folder-content>.help:last-child{font-size:13px;line-height:20px}
.surface-folder-actions{display:flex;align-items:center;gap:6px;flex:0 0 auto;padding-left:2px}
.surface-folder-actions .text-btn{font-size:13px;white-space:nowrap}
.surface-icon-btn.is-favorite{color:var(--accent)}
@media(max-width:640px){
 .surface-card.open-card,.surface-card.links-card,.surface-card.folders-card{max-width:100%;min-width:0}
 .surface-header{padding:14px 16px}
 .surface-meta{flex-wrap:wrap;gap:4px 12px}
 .surface-link-row{gap:10px}
 .surface-footer{flex-wrap:wrap;gap:10px}
 .surface-folder-row{gap:6px;padding-right:2px}
 .surface-folder-select{gap:8px}
 .surface-folder-actions{flex-direction:column;gap:2px;padding-left:0}
 .surface-folder-actions .text-btn{min-height:30px;padding:4px}
 .surface-tabs{gap:16px}
}

.surface-folder-list{max-height:190px;overflow-y:scroll;border-block:1px solid var(--border);scrollbar-width:thin;scrollbar-color:var(--muted) var(--bg)}
.surface-folder-row{min-height:94px;border-radius:var(--radius)}
.surface-folder-row.selected{border-left-color:transparent;box-shadow:inset 0 0 0 1px var(--success)}

<main class="main" :inert="!!panel"><div class="page-head"><h1>工具总览</h1><div class="inline"><button class="btn primary" @click="allTools(true)" :disabled="busy" data-testid="start-all">全部启动</button><button class="btn" @click="allTools(false)" :disabled="busy" data-testid="stop-all">全部关闭</button></div></div><div class="notice" x-show="loadWarning" x-text="loadWarning" role="alert" style="margin-bottom:16px"></div>
<template x-for="(group,gi) in [{label:'Eous原生工具',items:nativeTools},{label:'非Eous原生工具',items:externalTools}]" :key="group.label"><section class="group"><div class="group-head"><h2><span x-text="group.label"></span><span class="count" x-text="group.items.length"></span></h2><button class="text-btn" x-show="gi===1" @click="openPanel('program')" :disabled="busy" data-testid="add-program">＋ 添加程序</button></div><template x-for="(tool,index) in group.items" :key="tool.id"><article class="tool-row" :class="{running:tool.state==='running',failed:tool.state==='failed',pending:isPending(tool)}" :style="'--order:'+(gi*3+index)" :data-testid="'tool-'+tool.id"><svg class="tool-glyph" :class="{native:tool.kind==='native'}"><use :href="'#icon-'+tool.glyph"/></svg><div class="tool-copy"><div class="tool-name"><span x-text="tool.name"></span><span class="tool-alias" x-show="tool.englishName" x-text="tool.englishName"></span></div><div class="tool-desc" x-show="!tool.error" x-text="tool.description||'自定义程序'"></div><div class="tool-error" x-show="tool.error" x-text="tool.error"></div></div><div class="tool-state" aria-live="polite"><i class="status-dot" aria-hidden="true"></i><span x-text="stateLabel(tool)"></span></div><div class="row-actions"><button class="tool-switch" role="switch" :class="{on:['running','starting'].includes(tool.state)}" @click="toggleTool(tool)" :disabled="tool.id==='everything'&&!programs.everything.path" :aria-disabled="isPending(tool)||(tool.id==='everything'&&!programs.everything.path)" :aria-checked="tool.state==='running'" :aria-busy="isPending(tool)" :aria-label="tool.name+'启停'" :title="tool.id==='everything'&&!programs.everything.path?'请先设置程序路径':actionLabel(tool)"><span class="switch-thumb" aria-hidden="true"></span></button><button class="text-btn neutral" @click="openPanel(tool.kind==='native'?tool.id:'program',tool.kind==='external'?tool.id:'')" :aria-label="tool.name+'设置'" :class="{repair:tool.id==='everything'&&!programs.everything.path}" x-text="tool.id==='everything'&&!programs.everything.path?'设置路径':'设置'"></button></div></article></template><div class="empty" x-show="group.items.length===0">尚未添加程序</div></section></template>
</main></div><footer class="footer"><div class="footer-note"><svg><use href="#icon-info"/></svg><span>关闭面板后，已启动的工具继续运行</span></div></footer>
<div class="drawer-shade" x-show="panel" x-cloak @click="closePanel()" x-transition:enter="fade" x-transition:enter-start="fade-start" x-transition:enter-end="fade-end" x-transition:leave="fade" x-transition:leave-start="fade-end" x-transition:leave-end="fade-start"></div>
<section class="drawer" x-show="panel" x-cloak role="dialog" aria-modal="true" aria-labelledby="panel-title" x-transition:enter="drawer-enter" x-transition:enter-start="drawer-start" x-transition:enter-end="drawer-end" x-transition:leave="drawer-leave" x-transition:leave-start="drawer-end" x-transition:leave-end="drawer-start">
<header class="drawer-head"><div><h2 tabindex="-1" id="panel-title" x-text="panelTitle"></h2><div class="drawer-sub" x-text="panelSubtitle"></div></div><button class="icon-btn" @click="closePanel()" :disabled="saving" aria-label="关闭设置"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></header>
<div class="save-error" x-show="fieldError" x-text="fieldError" role="alert"></div><div class="drawer-body" id="panel-content"><template x-if="panel==='file'"><div><div class="segment" role="tablist" aria-label="文件快开设置">
  <button type="button" class="btn" :class="{primary:tab==='trigger'}" role="tab" :aria-selected="tab==='trigger'" @click="setFileTab('trigger')">触发与面板</button>
  <button type="button" class="btn" :class="{primary:tab==='apps'}" role="tab" :aria-selected="tab==='apps'" @click="setFileTab('apps')">打开方式</button>
</div>

<div x-show="tab==='trigger'" style="margin-top:28px">
  <div class="field">
    <div class="field-label" id="file-edge-label">触发边缘</div>
    <p class="help" style="margin:6px 0 14px">拖动文件到已选边缘，展开打开面板。</p>
    <div class="inline" role="group" aria-labelledby="file-edge-label" style="gap:28px">
      <label class="check"><input type="checkbox" x-model="draft.left">左边缘</label>
      <label class="check"><input type="checkbox" x-model="draft.right">右边缘</label>
      <label class="check"><input type="checkbox" x-model="draft.top">上边缘</label>
    </div>
  </div>
  <div class="divider"></div>
  <div class="form-grid">
    <div class="field">
      <label class="field-label" for="file-candidate-count">首屏候选数量</label>
      <input class="input" id="file-candidate-count" type="number" min="1" max="12" step="1" x-model.number="draft.count" style="margin-top:10px;width:100%">
      <p class="help" style="margin:7px 0 0">显示前 1–12 个已启用的软件。</p>
    </div>
    <div class="field">
      <label class="field-label" for="file-collapse-delay">自动收起延迟（秒）</label>
      <input class="input" id="file-collapse-delay" type="number" min="0.5" max="10" step="0.5" x-model.number="draft.collapse" style="margin-top:10px;width:100%">
      <p class="help" style="margin:7px 0 0">离开面板后等待 0.5–10 秒再收起。</p>
    </div>
  </div>
  <div class="form-row">
    <div>
      <div class="field-label">打开面板</div>
      <div class="help" style="margin-top:4px">查看文件拖入后的软件选择。</div>
    </div>
    <button type="button" class="btn" @click="openSurface('open')">查看打开面板</button>
  </div>
</div>

<div x-show="tab==='apps'" style="margin-top:28px">
  <div class="field">
    <div class="field-head">
      <div class="inline" style="gap:12px"><span class="field-label" style="margin:0">当前后缀</span><strong style="font-size:16px" x-text="draft.extension"></strong></div>
      <button type="button" class="text-btn" :aria-expanded="draft.showCategories" aria-controls="file-extension-picker" @click="draft.showCategories=!draft.showCategories" x-text="draft.showCategories?'收起后缀列表':'切换后缀'"></button>
    </div>
    <div id="file-extension-picker" x-show="draft.showCategories" style="margin-top:16px">
      <div class="form-grid">
        <div>
          <label class="help" for="file-extension-category">文件类别</label>
          <select class="select" id="file-extension-category" x-model="draft.category" style="width:100%;margin-top:6px">
            <option value="全部">全部类别</option>
            <option value="文档">文档</option>
            <option value="表格">表格</option>
            <option value="演示">演示</option>
            <option value="图片">图片</option>
            <option value="音频">音频</option>
            <option value="视频">视频</option>
            <option value="代码">代码</option>
            <option value="压缩包">压缩包</option>
          </select>
        </div>
        <div>
          <label class="help" for="file-extension-search">搜索后缀</label>
          <input class="input" id="file-extension-search" type="search" placeholder="例如 pdf、jpg" x-model="draft.search" style="width:100%;margin-top:6px">
        </div>
      </div>
      <label class="check" style="margin-top:14px"><input type="checkbox" x-model="draft.customizedOnly">只看已自定义</label>
      <div class="inline" role="group" aria-label="可选文件后缀" style="flex-wrap:wrap;margin-top:14px">
        <template x-for="item in filteredExtensions" :key="item.ext">
          <button type="button" class="btn small" :class="{primary:draft.extension===item.ext}" :aria-pressed="draft.extension===item.ext" @click="selectExtension(item.ext)" x-text="item.ext"></button>
        </template>
      </div>
      <div class="empty" x-show="filteredExtensions.length===0">
        <p class="help" style="margin:0 0 12px">没有匹配的后缀。</p>
        <button type="button" class="btn small" @click="addCustomExtension()" :disabled="!draft.search.trim()">添加此后缀</button>
        <p class="help" style="margin:10px 0 0">添加到文件快开，不更改 Windows 文件关联。</p>
      </div>
    </div>
  </div>
  <div class="divider"></div>
  <div class="field-head" style="margin-bottom:4px">
    <div class="field-label">候选软件 <span class="tag" style="margin-left:6px" x-text="draft.apps.filter(app=>app.enabled).length+' 个已启用'"></span></div>
    <button type="button" class="text-btn" @click="restoreRecommendations()">恢复当前后缀推荐</button>
  </div>
  <p class="help" style="margin:5px 0 12px">勾选决定是否显示，上下移动调整显示顺序。</p>
  <div class="app-list">
    <template x-for="(app,index) in draft.apps" :key="app.name">
      <div class="app-row" style="gap:16px;padding:12px 0">
        <label class="check" style="flex:1;min-width:0;align-items:center">
          <input type="checkbox" x-model="app.enabled" :aria-label="'显示 '+app.name">
          <span style="display:grid;gap:4px">
            <span style="font-size:14px;font-weight:600" x-text="app.name"></span>
            <span class="help" x-text="app.detail"></span>
          </span>
        </label>
        <div class="inline" style="gap:6px">
          <button type="button" class="btn small" :disabled="index===0" :aria-label="'上移 '+app.name" @click="moveApp(index,-1)">上移</button>
          <button type="button" class="btn small" :disabled="index===draft.apps.length-1" :aria-label="'下移 '+app.name" @click="moveApp(index,1)">下移</button>
        </div>
      </div>
    </template>
  </div>

<script>const cloneValue = value => JSON.parse(JSON.stringify(value));
const initialApps = ext => {
 const groups = {pdf:[['Microsoft Edge','系统默认'],['Adobe Acrobat','PDF 阅读与批注'],['WPS Office','文档与 PDF'],['Google Chrome','浏览器']],image:[['照片','系统默认'],['画图','图片编辑'],['Adobe Photoshop','图像处理']],code:[['Visual Studio Code','系统默认'],['记事本','文本编辑']],office:[['WPS Office','系统默认'],['Microsoft Office','文档编辑']],archive:[['7-Zip','系统默认'],['文件资源管理器','压缩包浏览']],media:[['VLC media player','系统默认'],['媒体播放器','音视频播放']]};
 const kind=ext==='.pdf'?'pdf':/\.(jpg|png|webp)$/.test(ext)?'image':/\.(txt|json|py|md|js)$/.test(ext)?'code':/\.(mp4|mp3|wav)$/.test(ext)?'media':/\.(zip|7z)$/.test(ext)?'archive':'office';
 return groups[kind].map((x,i)=>({name:x[0],detail:x[1],enabled:i<3}));
