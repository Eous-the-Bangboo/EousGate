<div x-data="createAssistant()" :data-theme="theme" @keydown.escape.window.prevent="handleEscape()" @keydown.window="trapFocus($event)">
<svg width="0" height="0" aria-hidden="true" style="position:absolute;overflow:hidden"><defs>
<symbol id="icon-file" viewBox="0 0 28 28"><path d="M7 3h8l5 5v15H7zM15 3v6h5M11 14h5m-5 4h5"/></symbol>
<symbol id="icon-link" viewBox="0 0 28 28"><path d="m11 17-2 2a5 5 0 0 1-7-7l5-5a5 5 0 0 1 7 0m-2 3 2-2a5 5 0 0 1 7 7l-5 5a5 5 0 0 1-7 0m-1-1 8-8"/></symbol>
<symbol id="icon-folder" viewBox="0 0 28 28"><path d="M3 7h8l3 3h10v13H3zM3 11h21M11 17h7m-3-3 3 3-3 3"/></symbol>
<symbol id="icon-clipboard" viewBox="0 0 28 28"><rect x="6" y="5" width="16" height="20" rx="2"/><path d="M10 5V3h8v4h-8zM10 13h8m-8 5h8"/></symbol>
<symbol id="icon-search" viewBox="0 0 28 28"><circle cx="12" cy="12" r="8"/><path d="m18 18 7 7"/></symbol>
<symbol id="icon-mic" viewBox="0 0 28 28"><rect x="10" y="3" width="8" height="14" rx="4"/><path d="M6 13v1a8 8 0 0 0 16 0v-1M14 22v4m-5 0h10"/></symbol>
<symbol id="icon-grid" viewBox="0 0 28 28"><rect x="3" y="3" width="8" height="8" rx="1"/><rect x="17" y="3" width="8" height="8" rx="1"/><rect x="3" y="17" width="8" height="8" rx="1"/><rect x="17" y="17" width="8" height="8" rx="1"/></symbol>
<symbol id="icon-settings" viewBox="0 0 28 28"><path d="m11 3 6 0 .7 3 2 1.2 3-.5 3 5-2.1 2.3v2l2.1 2.3-3 5-3-.5-2 1.2-.7 3h-6l-.7-3-2-1.2-3 .5-3-5L4.4 16v-2l-2.1-2.3 3-5 3 .5 2-1.2z" transform="translate(0 -1) scale(.95)"/><circle cx="14" cy="13.5" r="4"/></symbol>
<symbol id="icon-info" viewBox="0 0 28 28"><circle cx="14" cy="14" r="11"/><path d="M14 12v8m0-12v.1"/></symbol>
<symbol id="icon-program" viewBox="0 0 28 28"><rect x="3" y="4" width="22" height="20" rx="2"/><path d="M3 10h22M7 7h.1m4 0h.1"/></symbol>
</defs></svg>
<section class="app-window" :class="{maximized:maximized,'enter-first':entered}" x-show="!windowHidden" aria-label="Eous 助手">
<header class="titlebar"><div class="app-title"><img class="brand-icon" src="{{EOUS_ICON}}" alt=""><span>Eous 助手</span></div><div class="window-actions"><button aria-label="最小化" @click="hideWindow()"><svg viewBox="0 0 12 12"><path d="M1 6h10"/></svg></button><button aria-label="最大化或还原" @click="maximized=!maximized"><svg viewBox="0 0 12 12"><rect x="1.5" y="1.5" width="9" height="9"/></svg></button><button class="close" aria-label="关闭控制面板" @click="hideWindow()"><svg viewBox="0 0 12 12"><path d="m2 2 8 8m0-8-8 8"/></svg></button></div></header>
<div class="body"><aside class="sidebar" aria-label="主导航"><button class="nav" :class="{selected:!panel}" @click="closePanel()" :aria-current="!panel?'page':null"><svg><use href="#icon-grid"/></svg><span>工具总览</span></button><div class="nav-caption">工具设置</div><template x-for="tool in nativeTools" :key="tool.id"><button class="nav" :class="{selected:panel===tool.id}" @click="openPanel(tool.id)"><svg><use :href="'#icon-'+tool.glyph"/></svg><span x-text="tool.name"></span></button></template><div class="sidebar-scene" aria-hidden="true"><img class="eous-character" src="{{EOUS_CHARACTER}}" alt=""></div><div class="nav-bottom"><button class="nav" :class="{selected:panel==='general'}" @click="openPanel('general')"><svg><use href="#icon-settings"/></svg><span>通用设置</span></button><button class="nav" :class="{selected:panel==='about'}" @click="openPanel('about')"><svg><use href="#icon-info"/></svg><span>关于 Eous</span></button></div></aside>
<main class="main" :inert="!!panel"><div class="page-head"><h1>工具总览</h1><div class="inline"><button class="btn primary" @click="allTools(true)" :disabled="busy" data-testid="start-all">全部启动</button><button class="btn" @click="allTools(false)" :disabled="busy" data-testid="stop-all">全部关闭</button></div></div><div class="notice" x-show="loadWarning" x-text="loadWarning" role="alert" style="margin-bottom:16px"></div>
<template x-for="(group,gi) in [{label:'Eous原生工具',items:nativeTools},{label:'非Eous原生工具',items:externalTools}]" :key="group.label"><section class="group"><div class="group-head"><h2><span x-text="group.label"></span><span class="count" x-text="group.items.length"></span></h2><button class="text-btn" x-show="gi===1" @click="openPanel('program')" :disabled="busy" data-testid="add-program">＋ 添加程序</button></div><template x-for="(tool,index) in group.items" :key="tool.id"><article class="tool-row" :class="{running:tool.state==='running',failed:tool.state==='failed',pending:isPending(tool)}" :style="'--order:'+(gi*3+index)" :data-testid="'tool-'+tool.id"><svg class="tool-glyph" :class="{native:tool.kind==='native'}"><use :href="'#icon-'+tool.glyph"/></svg><div class="tool-copy"><div class="tool-name"><span x-text="tool.name"></span><span class="tool-alias" x-show="tool.englishName" x-text="tool.englishName"></span></div><div class="tool-desc" x-show="!tool.error" x-text="tool.description||'自定义程序'"></div><div class="tool-error" x-show="tool.error" x-text="tool.error"></div></div><div class="tool-state" aria-live="polite"><i class="status-dot" aria-hidden="true"></i><span x-text="stateLabel(tool)"></span></div><div class="row-actions"><button class="tool-switch" role="switch" :class="{on:['running','starting'].includes(tool.state)}" @click="toggleTool(tool)" :disabled="tool.id==='everything'&&!programs.everything.path" :aria-disabled="isPending(tool)||(tool.id==='everything'&&!programs.everything.path)" :aria-checked="tool.state==='running'" :aria-busy="isPending(tool)" :aria-label="tool.name+'启停'" :title="tool.id==='everything'&&!programs.everything.path?'请先设置程序路径':actionLabel(tool)"><span class="switch-thumb" aria-hidden="true"></span></button><button class="text-btn neutral" @click="openPanel(tool.kind==='native'?tool.id:'program',tool.kind==='external'?tool.id:'')" :aria-label="tool.name+'设置'" :class="{repair:tool.id==='everything'&&!programs.everything.path}" x-text="tool.id==='everything'&&!programs.everything.path?'设置路径':'设置'"></button></div></article></template><div class="empty" x-show="group.items.length===0">尚未添加程序</div></section></template>
</main></div><footer class="footer"><div class="footer-note"><svg><use href="#icon-info"/></svg><span>关闭面板后，已启动的工具继续运行</span></div></footer>
<div class="drawer-shade" x-show="panel" x-cloak @click="closePanel()" x-transition:enter="fade" x-transition:enter-start="fade-start" x-transition:enter-end="fade-end" x-transition:leave="fade" x-transition:leave-start="fade-end" x-transition:leave-end="fade-start"></div>
<section class="drawer" x-show="panel" x-cloak role="dialog" aria-modal="true" aria-labelledby="panel-title" x-transition:enter="drawer-enter" x-transition:enter-start="drawer-start" x-transition:enter-end="drawer-end" x-transition:leave="drawer-leave" x-transition:leave-start="drawer-end" x-transition:leave-end="drawer-start">
<header class="drawer-head"><div><h2 tabindex="-1" id="panel-title" x-text="panelTitle"></h2><div class="drawer-sub" x-text="panelSubtitle"></div></div><button class="icon-btn" @click="closePanel()" :disabled="saving" aria-label="关闭设置"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></svg></button></header>
<div class="save-error" x-show="fieldError" x-text="fieldError" role="alert"></div><div class="drawer-body" id="panel-content">{{PANELS}}</div>
<div class="save-error" x-show="saveError" x-text="saveError" role="alert"></div><footer class="drawer-foot" x-show="panel!=='about'"><span class="draft-indicator" :class="{changed:dirty}" x-text="saving?'正在保存，请稍候':dirty?'有未应用的修改':'未作修改'"></span><div class="inline"><button class="btn" @click="closePanel()" :disabled="saving">关闭</button><button class="btn primary" @click="saveDraft()" :disabled="saving||!dirty" x-text="saving?'正在保存…':panel==='program'&&!programId?'添加程序':'应用设置'" data-testid="apply-settings"></button></div></footer>
</section>
{{SURFACES}}
<div class="confirm-shade" x-show="picker" x-cloak @click.self="picker=false"><section class="confirm-card exe-picker" role="dialog" aria-modal="true" aria-labelledby="exe-title"><h2 id="exe-title">选择程序</h2><p>选择可执行文件，或返回填写完整路径。</p><div class="stack"><template x-for="entry in [{name:'QuickLook',path:'C:\Tools\QuickLook\\QuickLook.exe'},{name:'Everything',path:'C:\Program Files\Everything\\Everything.exe'},{name:'Obsidian',path:'C:\Tools\Obsidian\\Obsidian.exe'}]" :key="entry.name"><button class="btn" style="display:grid;text-align:left;justify-content:start;white-space:normal" @click="selectExe(entry.name,entry.path)"><strong x-text="entry.name"></strong><span class="help" x-text="entry.path"></span></button></template></div><div class="confirm-actions"><button class="btn" @click="picker=false">返回填写路径</button></div></section></div>
<div class="confirm-shade" x-show="confirm" x-cloak><section class="confirm-card" role="alertdialog" aria-modal="true" aria-labelledby="confirm-title"><h2 tabindex="-1" id="confirm-title" x-text="confirm?.title"></h2><p x-text="confirm?.detail"></p><div class="confirm-actions"><button class="btn" @click="confirm=null" :disabled="saving">继续编辑</button><button class="btn" x-show="['discard','navigate'].includes(confirm?.type)" @click="discardChanges()" :disabled="saving">放弃修改</button><button class="btn primary" @click="confirmPrimary()" :disabled="saving" x-text="saving?'正在保存…':['discard','navigate'].includes(confirm?.type)?'保存修改':confirm?.type==='restore'?'恢复当前后缀':confirm?.type==='restore-category'?'恢复本类推荐':confirm?.type==='remove-program'?'移除程序':'清空普通历史'"></button></div></section></div>
<div class="toast" :class="{'error-toast':toastError}" x-show="toast" x-cloak role="status" x-text="toast" x-transition.opacity.duration.180ms></div>
<input type="file" accept=".json,application/json" x-ref="historyImport" @change="readHistory($event)" hidden>
</section>
<section class="reopen-stage" x-show="windowHidden" x-cloak><h1>Eous 助手</h1><p>面板已收起，已启动的工具继续运行。</p><button class="btn primary" @click="restoreWindow()">打开控制面板</button></section>
</div>
