<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=640, initial-scale=1"><title>C · 紧凑命令面板</title>
<style>
:root{font-family:"Microsoft YaHei","Microsoft YaHei UI",sans-serif;color:#202221;font-size:14px;background:#f3f3f0;font-synthesis:none}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;overflow:hidden}button,input{font:inherit}button{color:inherit;border:0;background:none;padding:0}.app{width:640px;height:620px;display:grid;grid-template-rows:40px 54px 24px 150px 32px 164px 76px 50px 28px;background:#f3f3f0;border:1px solid #cfd3cd;overflow:hidden}.titlebar{display:flex;align-items:center;padding:0 16px;gap:8px;background:#fff;border-bottom:1px solid #e4e6e1}.brand{width:19px;height:19px}.titlebar strong{font-size:14px;font-weight:600}.window-actions{display:flex;align-items:center;gap:19px;margin-left:auto;font-size:13px}.window-actions button{display:flex;align-items:center;gap:5px}.window-actions svg{width:15px;height:15px}.separator{width:1px;height:14px;background:#cfd3cd}.search-wrap{padding:10px 16px 8px}.search{height:36px;display:flex;gap:9px;align-items:center;border:1px solid #cfd3cd;background:white;padding:0 10px}.search svg{width:18px;height:18px;color:#666d65}.search input{width:100%;outline:0;border:0;background:transparent;min-width:0;color:#202221}.search input::placeholder{color:#747b73}.key{white-space:nowrap;font-family:Consolas,monospace;color:#72786f;font-size:13px}.group-title{padding:0 18px;display:flex;align-items:center;font-size:13px;font-weight:600;color:#5e655c}.external-title{border-top:1px solid #cfd3cd;justify-content:space-between;padding-top:4px}.add{display:flex;align-items:center;gap:5px;font-weight:400;color:#202221}.add svg{width:14px;height:14px}.rows{background:#fff;margin:0 12px}.tool{height:50px;display:flex;gap:11px;align-items:center;padding:0 10px;border-bottom:1px solid #e8eae5;border-left:3px solid transparent}.tool:last-child{border-bottom:0}.tool.selected{background:#e4e6e1;border-left-color:#202221}.tool-icon{width:23px;height:23px;flex-shrink:0;color:#4a5147}.tool-info{flex:1;min-width:0}.tool-name{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;line-height:22px;white-space:nowrap}.tool-desc{font-size:13px;line-height:19px;color:#596157;white-space:nowrap}.status{font-size:13px;white-space:nowrap;width:68px;display:flex;align-items:center;gap:6px;color:#5a6256}.status .dot{width:6px;height:6px;border:1px solid #9aa193;border-radius:50%}.running .dot{background:#3d4937;border-color:#3d4937}.failed .dot{border:0;border-radius:0;width:13px;height:13px}.row-action{width:64px;height:29px;border:1px solid #cfd3cd;background:#fff;font-size:13px;white-space:nowrap}.selected .row-action{background:transparent;border-color:#aeb5a7}.external .tool.error-row{height:64px}.error-text{color:#584f44;line-height:18px;font-size:13px}.selection{margin-top:10px;border-top:1px solid #cfd3cd;border-bottom:1px solid #cfd3cd;background:#fff;display:flex;align-items:center;gap:8px;padding:0 20px}.selection-meta{flex:1}.selection-caption{font-size:13px;color:#687063;line-height:20px}.selection-title{font-size:15px;font-weight:600;line-height:24px}.config{height:34px;border:1px solid #cfd3cd;padding:0 17px}.primary{height:34px;background:#202221;color:#fff;padding:0 24px;font-weight:600}.globals{display:flex;align-items:center;justify-content:flex-end;padding:0 20px;gap:10px}.globals button{font-size:13px;height:30px;padding:0 14px;border:1px solid #cfd3cd;background:#f3f3f0}.globals button:first-child{background:#fff}.global-label{font-size:13px;color:#687063;margin-right:auto}.footer{font-size:13px;color:#596157;padding:2px 20px 0;line-height:20px;display:flex;align-items:flex-start;gap:7px}.footer svg{width:14px;height:14px;margin-top:3px}svg{display:block;fill:none;stroke:currentColor;stroke-width:1.55;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
<symbol id="file" viewBox="0 0 24 24"><path d="M7 3H15L20 8V21H5V3H7Z M15 3V9H20 M9 14H15 M9 17H13"/></symbol>
<symbol id="link" viewBox="0 0 24 24"><path d="M10 14L14 10 M8.5 15.5L6.8 17.2A4 4 0 0 1 1.2 11.6L5.6 7.2A4 4 0 0 1 11.2 7.2 M15.5 8.5L17.2 6.8A4 4 0 0 1 22.8 12.4L18.4 16.8A4 4 0 0 1 12.8 16.8" transform="translate(1 -1) scale(.91)"/></symbol>
<symbol id="folder" viewBox="0 0 24 24"><path d="M3 7V20H21V7H11L9 4H3V7Z M8 13H17 M14 10L17 13L14 16"/></symbol>
<symbol id="clipboard" viewBox="0 0 24 24"><path d="M8 5H5V21H19V5H16 M8 3H16V7H8Z M9 12H15 M9 16H14"/></symbol>
<symbol id="search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M16 16L21 21"/></symbol>
<symbol id="mic" viewBox="0 0 24 24"><rect x="8" y="2" width="8" height="13" rx="4"/><path d="M5 11V12A7 7 0 0 0 19 12V11 M12 19V22 M8 22H16"/></symbol>
<symbol id="settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M9 3H15L16 6L19 7L22 10V14L19 17L16 18L15 21H9L8 18L5 17L2 14V10L5 7L8 6Z"/></symbol>
<symbol id="warning" viewBox="0 0 16 16"><path d="M8 2L14 13H2Z M8 6V9 M8 11V11.2"/></symbol>
</defs></svg>
<main class="app app-window">
<header class="titlebar"><svg class="brand" viewBox="0 0 24 24"><path d="M4 4H20V20H4Z M8 8H16 M8 12H14 M8 16H16"/></svg><strong>Eous 助手</strong><div class="window-actions"><button><svg><use href="#settings"/></svg>设置</button><span class="separator"></span><button aria-label="最小化"><svg viewBox="0 0 20 20"><path d="M5 11H15"/></svg></button><button aria-label="关闭面板"><svg viewBox="0 0 20 20"><path d="M6 6L14 14 M6 14L14 6"/></svg></button></div></header>
<div class="search-wrap"><div class="search"><svg><use href="#search"/></svg><input aria-label="筛选工具" placeholder="筛选工具" readonly><span class="key">Ctrl K</span></div></div>
<div class="group-title">Eous原生工具</div>
<section class="rows" aria-label="Eous原生工具">
<div class="tool selected"><svg class="tool-icon"><use href="#file"/></svg><div class="tool-info"><div class="tool-name">文件快开</div><div class="tool-desc">拖到屏幕边缘，选择软件打开</div></div><span class="status running"><i class="dot"></i>运行中</span><button class="row-action">停止</button></div>
<div class="tool"><svg class="tool-icon"><use href="#link"/></svg><div class="tool-info"><div class="tool-name">网页快开</div><div class="tool-desc">复制网页链接，点击提示打开</div></div><span class="status"><i class="dot"></i>未运行</span><button class="row-action">启动</button></div>
<div class="tool"><svg class="tool-icon"><use href="#folder"/></svg><div class="tool-info"><div class="tool-name">文件夹快跳</div><div class="tool-desc">在打开和保存对话框快速跳转</div></div><span class="status running"><i class="dot"></i>运行中</span><button class="row-action">停止</button></div>
</section>
<div class="group-title external-title"><span>非Eous原生工具</span><button class="add"><svg viewBox="0 0 20 20"><path d="M10 4V16 M4 10H16"/></svg>添加程序</button></div>
<section class="rows external" aria-label="非Eous原生工具">
<div class="tool"><svg class="tool-icon"><use href="#clipboard"/></svg><div class="tool-info"><div class="tool-name">Ditto</div><div class="tool-desc">剪贴板管理</div></div><span class="status running"><i class="dot"></i>运行中</span><button class="row-action">停止</button></div>
<div class="tool error-row"><svg class="tool-icon"><use href="#search"/></svg><div class="tool-info"><div class="tool-name">Everything <span style="font-size:13px;font-weight:400;color:#687063">文件搜索</span></div><div class="error-text">未找到程序，请设置路径</div></div><span class="status failed"><svg class="dot"><use href="#warning"/></svg>启动失败</span><button class="row-action">设置路径</button></div>
<div class="tool"><svg class="tool-icon"><use href="#mic"/></svg><div class="tool-info"><div class="tool-name">无线麦 Sayall</div><div class="tool-desc">语音输入</div></div><span class="status"><i class="dot"></i>未运行</span><button class="row-action">启动</button></div>
</section>
<section class="selection" aria-label="当前选择工具的操作"><div class="selection-meta"><div class="selection-caption">当前选择</div><div class="selection-title">文件快开</div></div><button class="config">配置</button><button class="primary">停止</button></section>
<div class="globals"><span class="global-label">所有工具</span><button>全部启动</button><button>全部关闭</button></div>
<footer class="footer"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="7"/><path d="M10 9V13 M10 6V6.2"/></svg><span>关闭面板后，已启动的工具继续运行</span></footer>
</main>
</body></html>
