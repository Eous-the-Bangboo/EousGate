<div class="surface-overlay" x-show="surface" x-cloak @click.self="closeSurface()" @keydown.escape.stop="closeSurface()">
  <section class="surface-card" :class="{'open-card': surface === 'open', 'links-card': surface === 'links', 'folders-card': surface === 'folders'}" role="dialog" aria-modal="true" aria-labelledby="surface-title" :style="surface==='links'?{justifySelf:(panel==='web'?draft.side:settings.web.side)==='left'?'start':'end'}:{}">
    <header class="surface-header">
      <h2 tabindex="-1" id="surface-title" class="section-title" x-text="surfaceTitle"></h2>
      <button type="button" class="surface-close" @click="closeSurface()" aria-label="关闭面板">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
      </button>
    </header>
    <div x-show="surface === 'open'" class="surface-body">
      <p class="section-help">为以下 2 个文件选择打开软件</p>
      <div class="surface-files">
        <span class="surface-file">季度报告.pdf</span>
        <span class="surface-file">项目预算.pdf</span>
      </div>
      <div class="app-list" x-show="!surfaceEmpty">
        <template x-for="appName in openAppChoices" :key="appName">
          <button type="button" class="surface-app-row" @click="chooseOpenApp(appName)">
            <span class="surface-app-mark" aria-hidden="true" x-text="appName.slice(0, 1)"></span>
            <span x-text="appName"></span>
            <svg class="surface-arrow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m9 5 7 7-7 7"/></svg>
          </button>
        </template>
      </div>
      <div class="empty" x-show="surfaceEmpty">
        <p class="field-label">没有可用软件</p>
        <p class="help">使用系统打开方式选择其他软件。</p>
      </div>
      <button type="button" class="text-btn" x-show="allOpenApps.length>openAppChoices.length" @click="showMoreApps=true">查看更多软件</button><footer class="surface-footer">
        <span class="help">2 个 PDF 文件</span>
        <button type="button" class="text-btn" @click="chooseOpenApp('Windows 系统打开方式')">系统打开方式</button>
      </footer>
    </div>
    <div x-show="surface === 'links'" class="surface-body" @mouseenter="linkPaused = true" @mouseleave="linkPaused = false" @focusin="linkPaused = true" @focusout="linkPaused = false">
      <div class="surface-meta">
        <p class="section-help">已检测到 <span x-text="links.length"></span> 个链接</p>
        <span class="tag" aria-live="polite" x-text="isLinkPaused ? '已暂停收起' : linkRemaining + ' 秒后收起'"></span>
      </div>
      <div class="surface-link-list">
        <template x-for="link in links" :key="link.id">
          <article class="surface-link-row">
            <div class="surface-link-content">
              <h3 class="field-label" x-text="link.title"></h3>
              <p class="surface-url" x-text="link.url"></p>
              <p class="error" x-show="link.error" x-text="link.error" role="alert"></p>
              <p class="help" x-show="link.opened && !link.error">已打开</p>
            </div>
            <button type="button" class="btn small" :class="{'primary': !link.opened}" @click="openLink(link)" :aria-label="(link.error ? '重试打开：' : '打开：') + link.title" x-text="link.error ? '重试打开' : link.opened ? '再次打开' : '打开链接'"></button>
          </article>
        </template>
      </div>
      <footer class="surface-footer">
        <span class="help">指针停留或键盘操作时暂停收起。</span>
      </footer>
    </div>
    <div x-show="surface === 'folders'" class="surface-body">
      <div class="field">
        <label for="surface-folder-search" class="field-label">搜索目录</label>
        <input id="surface-folder-search" class="input" type="search" x-model="folderSearch" placeholder="输入目录名称或路径" autocomplete="off">
      </div>
      <div class="surface-tabs" role="tablist" aria-label="目录来源">
        <button id="folder-tab-recent" type="button" role="tab" :aria-selected="folderTab === 'recent'" aria-controls="surface-folder-list" :class="{'active': folderTab === 'recent'}" @click="setFolderTab('recent')">最近访问</button>
        <button id="folder-tab-favorite" type="button" role="tab" :aria-selected="folderTab === 'favorite'" aria-controls="surface-folder-list" :class="{'active': folderTab === 'favorite'}" @click="setFolderTab('favorite')">收藏目录</button>
        <button id="folder-tab-open" type="button" role="tab" :aria-selected="folderTab === 'open'" aria-controls="surface-folder-list" :class="{'active': folderTab === 'open'}" @click="setFolderTab('open')">已打开</button>
      </div>
      <div id="surface-folder-list" class="surface-folder-list" role="tabpanel" :aria-labelledby="'folder-tab-' + folderTab">
        <template x-for="folder in filteredFolders" :key="folder.id">
          <div class="surface-folder-row" :class="{'selected': selectedFolder === folder.id}">
            <button type="button" class="surface-folder-select" :aria-pressed="selectedFolder === folder.id" @click="selectedFolder = folder.id" @dblclick="chooseFolder(folder)" @keydown.enter.prevent="chooseFolder(folder)">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M3 7a2 2 0 0 1 2-2h5l2 2h7a2 2 0 0 1 2 2v10H3Z"/></svg>
              <span class="surface-folder-content">
                <span class="field-label" x-text="folder.name"></span>
                <span class="surface-folder-path help" x-text="folder.path"></span>
                <span class="help" x-text="folder.open ? '当前已打开' : folder.time"></span>
              </span>
            </button>
            <div class="surface-folder-actions">
              <button type="button" class="surface-icon-btn" @click="toggleFavorite(folder.id)" :aria-label="(folder.favorite ? '取消收藏：' : '收藏：') + folder.name" :aria-pressed="folder.favorite" :class="{'is-favorite': folder.favorite}">
                <svg width="19" height="19" viewBox="0 0 24 24" :fill="folder.favorite ? 'currentColor' : 'none'" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="m12 3 2.8 5.7 6.3.9-4.5 4.4 1 6.3-5.6-3-5.6 3 1-6.3L2.9 9.6l6.3-.9Z"/></svg>
              </button>
              <button type="button" class="text-btn" @click="removeFolder(folder.id)" :aria-label="'移除历史记录：' + folder.name">移除</button>
            </div>
          </div>
        </template>
        <div class="empty" x-show="filteredFolders.length === 0">
          <p class="field-label" x-text="folderSearch ? '没有匹配的目录' : folderTab === 'favorite' ? '暂无收藏目录' : folderTab === 'open' ? '暂无已打开目录' : '暂无访问记录'"></p>
          <p class="help" x-text="folderSearch ? '试试其他名称或路径。' : folderTab === 'favorite' ? '点击目录旁的星标即可收藏。' : '访问目录后，可在这里快速找到。'"></p>
        </div>
      </div>
      <footer class="surface-footer">
        <span class="help">双击目录可直接跳转。</span>
        <button type="button" class="btn primary" :disabled="!selectedFolder" @click="jumpToSelectedFolder()">跳转到所选目录</button>
      </footer>
    </div>
  </section>
</div>
